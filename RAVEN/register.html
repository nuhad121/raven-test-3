<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register | RAVEN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<body data-page="register">
<div id="page-loader"><div class="loader-logo">RAVEN</div></div>
<div id="site-header"></div>
<main class="container"><div class="auth-card"><h2 class="text-center">Create Account</h2>
<form id="register-form"><input name="name" class="form-control mb-2" required placeholder="Name"/>
<input name="email" type="email" class="form-control mb-2" required placeholder="Email"/>
<input name="phone" class="form-control mb-2" required placeholder="01XXXXXXXXX"/>
<div class="password-field-wrap mb-1">
<input name="password" id="reg-password" type="password" class="form-control" required placeholder="Password" autocomplete="new-password"/>
<button type="button" class="password-toggle-btn" data-toggle-password="reg-password" aria-label="Show password"><i class="bi bi-eye"></i></button>
</motion>
<div class="progress mb-1" style="height:4px"><div id="password-strength-bar" class="progress-bar"></div></div><small class="text-muted d-block mb-2"></small>
<div class="password-field-wrap mb-3">
<input name="confirm" id="reg-confirm" type="password" class="form-control" required placeholder="Confirm password" autocomplete="new-password"/>
<button type="button" class="password-toggle-btn" data-toggle-password="reg-confirm" aria-label="Show password"><i class="bi bi-eye"></i></button>
</div>
<button type="submit" class="btn btn-dark w-100" id="register-submit-btn">Sign Up</button></form></div></main>
<div id="site-footer"></div>
