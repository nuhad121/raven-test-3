<!DOCTYPE html>
<html lang="en">
<head>
  <script>/*RAVEN_GH_PAGES*/(function(){var h=location.hostname;if(!h.endsWith('github.io'))return;var p=location.pathname.split('/').filter(Boolean);if(!p.length)return;var r=p[0];if(r.indexOf('.')!==-1)return;if(h.split('.')[0].toLowerCase()===r.toLowerCase())return;var b=location.pathname.indexOf('/admin/')!==-1?'/'+r+'/admin/':'/'+r+'/';document.write('<base href="'+b+'">');})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RAVEN - Premium fashion & streetwear for Bangladesh" />
  <title>RAVEN | Premium Fashion Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/main.css" rel="stylesheet" />
</head>
<body data-page="home">
  <div id="page-loader"><div class="loader-logo">RAVEN</div></div>

  <div id="site-header"></div>

  <main>
    <!-- Hero carousel (Rokomari-style prominent banner) -->
    <section class="hero-section">
      <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="hero-carousel-inner"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </section>

    <!-- Featured categories -->
    <section class="container py-5">
      <h2 class="section-title">Shop by Category</h2>
      <div class="row g-3" id="category-icons"></div>
    </section>

    <!-- Flash sale -->
    <section class="container pb-4">
      <div class="flash-sale-bar rounded-3 px-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div>
            <strong><i class="bi bi-lightning-charge"></i> Flash Sale</strong>
            <span class="ms-2 opacity-75">Ends in</span>
          </div>
          <span id="flash-countdown" class="flash-timer">08:00:00</span>
          <a href="shop.html?flash=1" class="btn btn-sm btn-outline-light">View All</a>
        </div>
      </div>
      <div class="scroll-row mt-3" id="flash-products"></div>
    </section>

    <!-- Trending -->
    <section class="container py-5">
      <h2 class="section-title">
        Trending Now
        <a href="shop.html" class="btn btn-sm btn-outline-dark">See All</a>
      </h2>
      <div class="product-grid" id="trending-products"></div>
    </section>

    <!-- New arrivals -->
    <section class="container py-4 bg-light rounded-4 px-4 mb-5" style="background: var(--raven-surface) !important;">
      <h2 class="section-title">New Arrivals</h2>
      <div class="product-grid" id="new-arrivals"></div>
    </section>

    <!-- Featured -->
    <section class="container pb-5">
      <h2 class="section-title">Featured Picks</h2>
      <div class="product-grid" id="featured-products"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/products.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
