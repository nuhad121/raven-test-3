<!DOCTYPE html>
<html lang="en">
<head>
  <script>/*RAVEN_GH_PAGES*/(function(){var h=location.hostname;if(!h.endsWith('github.io'))return;var p=location.pathname.split('/').filter(Boolean);if(!p.length)return;var r=p[0];if(r.indexOf('.')!==-1)return;if(h.split('.')[0].toLowerCase()===r.toLowerCase())return;var b=location.pathname.indexOf('/admin/')!==-1?'/'+r+'/admin/':'/'+r+'/';document.write('<base href="'+b+'">');})();</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard | RAVEN Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="../css/main.css" rel="stylesheet"/>
<link href="../css/admin.css" rel="stylesheet"/>
</head>
<body data-admin-page="dashboard">
<div class="admin-layout">
<aside id="admin-sidebar"></aside>
<div class="admin-main">
<header class="admin-topbar"><h5 class="mb-0">Dashboard</h5><div><button data-theme-toggle class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-moon"></i></button><span id="admin-user"></span></div></header>
<div class="admin-content"><div class="row g-3 mb-4">
<div class="col-md-3"><div class="stat-card"><p>Revenue</p><h3 id="stat-revenue">৳0</h3></div></div>
<div class="col-md-3"><div class="stat-card"><p>Orders</p><h3 id="stat-orders">0</h3></div></div>
<div class="col-md-3"><div class="stat-card"><p>Products</p><h3 id="stat-products">0</h3></div></div>
<div class="col-md-3"><div class="stat-card"><p>Customers</p><h3 id="stat-users">0</h3></div></div></div>
<div class="row g-4"><div class="col-lg-7"><div class="admin-table p-3"><h6>Recent Orders</h6>
<table class="table table-sm"><thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="recent-orders"></tbody></table></div></div>
<div class="col-lg-5"><div class="admin-table p-3"><h6>Activity</h6>
<table class="table table-sm"><thead><tr><th>Event</th><th>User</th><th>Date</th></tr></thead><tbody id="user-activity"></tbody></table></div></div></div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script><script src="../js/storage.js"></script><script src="../js/auth.js"></script>
<script src="../js/cart.js"></script><script src="../js/ui.js"></script><script src="../js/products.js"></script>
<script src="../js/components.js"></script><script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{RavenDB.init();RavenAuth.init();if(RavenAdmin.init('dashboard')){}});</script>
</body>
</html>
