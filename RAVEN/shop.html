<!DOCTYPE html>
<html lang="en">
<head>
  <script>/*RAVEN_GH_PAGES*/(function(){var h=location.hostname;if(!h.endsWith('github.io'))return;var p=location.pathname.split('/').filter(Boolean);if(!p.length)return;var r=p[0];if(r.indexOf('.')!==-1)return;if(h.split('.')[0].toLowerCase()===r.toLowerCase())return;var b=location.pathname.indexOf('/admin/')!==-1?'/'+r+'/admin/':'/'+r+'/';document.write('<base href="'+b+'">');})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | RAVEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/main.css" rel="stylesheet" />
</head>
<body data-page="shop">
  <div id="page-loader"><div class="loader-logo">RAVEN</div></div>
  <div id="site-header"></div>
  <main class="container py-4">
    <h1 class="mb-4">Shop All</h1>
    <div class="shop-layout">
      <aside class="filter-sidebar">
        <div class="filter-box">
          <h6 class="mb-3">Filters</h6>
          <label class="form-label small">Category</label>
          <select id="filter-category" class="form-select mb-3">
            <option value="">All Categories</option>
            <option value="hoodies">Hoodies</option>
            <option value="t-shirts">T-Shirts</option>
            <option value="sneakers">Sneakers</option>
            <option value="jackets">Jackets</option>
            <option value="cargo-pants">Cargo Pants</option>
            <option value="streetwear">Streetwear</option>
          </select>
          <label class="form-label small">Sort</label>
          <select id="filter-sort" class="form-select mb-3">
            <option value="">Trending</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
          <label class="form-label small">Min Price (৳)</label>
          <input type="number" id="filter-min" class="form-control mb-2" placeholder="0" />
          <label class="form-label small">Max Price (৳)</label>
          <input type="number" id="filter-max" class="form-control mb-3" placeholder="10000" />
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="filter-flash" />
            <label class="form-check-label" for="filter-flash">Flash Sale Only</label>
          </div>
        </div>
      </aside>
      <div>
        <p class="text-muted mb-3"><span id="shop-count">0</span></p>
        <div class="product-grid" id="shop-grid"></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
  <script src="js/cart.js"></script><script src="js/ui.js"></script><script src="js/products.js"></script>
  <script src="js/components.js"></script><script src="js/app.js"></script>
</body>
</html>
